<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Notes</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --surface-2: #232732;
      --text: #e8eaed;
      --muted: #9aa0aa;
      --accent: #6ea8fe;
      --danger: #ff6b6b;
      --radius: 14px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --surface-2: #eef0f3;
        --text: #1a1d24;
        --muted: #6b7280;
        --accent: #2563eb;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      padding: 18px 20px 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    header h1 { font-size: 26px; margin: 0; letter-spacing: -0.5px; }
    header .count { color: var(--muted); font-size: 14px; }
    .composer {
      padding: 0 16px 10px;
      display: flex;
      gap: 8px;
    }
    .composer input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--surface-2);
      color: var(--text);
      padding: 14px 16px;
      border-radius: var(--radius);
      font-size: 16px;
      outline: none;
    }
    .composer input:focus { border-color: var(--accent); }
    .composer button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: var(--radius);
      font-size: 22px;
      font-weight: 600;
    }
    .composer button:active { opacity: 0.8; }
    #list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .note {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      animation: pop 0.15s ease;
    }
    @keyframes pop { from { transform: scale(0.98); opacity: 0; } }
    .note .body { flex: 1; min-width: 0; }
    .note .text {
      font-size: 16px;
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .note .time { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .note .del {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      padding: 2px 6px;
      border-radius: 8px;
    }
    .note .del:active { color: var(--danger); }
    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 60px;
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Notes</h1>
    <span class="count" id="count"></span>
  </header>
  <div class="composer">
    <input id="input" type="text" placeholder="Write a note…" autocomplete="off" />
    <button id="add" aria-label="Add note">+</button>
  </div>
  <div id="list"></div>

  <script>
    const KEY = "notes.v1";
    const listEl = document.getElementById("list");
    const inputEl = document.getElementById("input");
    const countEl = document.getElementById("count");

    let notes = load();

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch { return []; }
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(notes)); }

    function fmt(ts) {
      const d = new Date(ts);
      return d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function render() {
      listEl.innerHTML = "";
      countEl.textContent = notes.length ? notes.length + (notes.length === 1 ? " note" : " notes") : "";
      if (!notes.length) {
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "No notes yet.\nWrite one above to get started.";
        listEl.appendChild(e);
        return;
      }
      for (const n of notes) {
        const card = document.createElement("div");
        card.className = "note";
        const body = document.createElement("div");
        body.className = "body";
        const text = document.createElement("div");
        text.className = "text";
        text.textContent = n.text;
        const time = document.createElement("div");
        time.className = "time";
        time.textContent = fmt(n.ts);
        body.appendChild(text);
        body.appendChild(time);
        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.setAttribute("aria-label", "Delete note");
        del.onclick = () => removeNote(n.id);
        card.appendChild(body);
        card.appendChild(del);
        listEl.appendChild(card);
      }
    }

    function addNote() {
      const t = inputEl.value.trim();
      if (!t) return;
      notes.unshift({ id: Date.now() + "-" + Math.random().toString(36).slice(2), text: t, ts: Date.now() });
      inputEl.value = "";
      save();
      render();
    }

    function removeNote(id) {
      notes = notes.filter(n => n.id !== id);
      save();
      render();
    }

    document.getElementById("add").onclick = addNote;
    inputEl.addEventListener("keydown", e => { if (e.key === "Enter") addNote(); });

    render();
  </script>
</body>
</html>
